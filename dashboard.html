pread", "source": "FRED", "series_id": "T10Y2Y", "direct_download_url": "https://fred.stlouisfed.org/graph/fredgraph.csv?id=T10Y2Y", "frequency": "Daily", "units": "% (year-avg)", "y2019": "0.09", "y2020": "0.58", "y2021": "0.91", "y2022": "0.16", "y2023": "-0.36", "notes": "Negative = inversion signal"}, {"indicator": "Euro Area HICP Inflation", "source": "ECB/Eurostat", "series_id": "(prices series via ECB SDW)", "direct_download_url": "https://data.ecb.europa.eu/", "frequency": "Monthly", "units": "% YoY (year-avg)", "y2019": "1.2", "y2020": "0.3", "y2021": "2.6", "y2022": "8.4", "y2023": "5.4", "notes": "Annual average"}, {"indicator": "Euro Area Unemployment", "source": "Eurostat", "series_id": "une_rt_m", "direct_download_url": "https://ec.europa.eu/eurostat/web/products-euro-indicators", "frequency": "Monthly", "units": "% (year-avg)", "y2019": "7.6", "y2020": "7.9", "y2021": "7.7", "y2022": "6.8", "y2023": "6.5", "notes": "Annual average"}, {"indicator": "ECB Deposit Facility Rate (year-end)", "source": "ECB", "series_id": "key rates", "direct_download_url": "https://www.ecb.europa.eu/stats/policy_and_exchange_rates/key_ecb_interest_rates/html/index.en.html", "frequency": "Policy", "units": "% (year-end)", "y2019": "-0.50", "y2020": "-0.50", "y2021": "-0.50", "y2022": "2.00", "y2023": "4.00", "notes": "Year-end standing rate"}, {"indicator": "World GDP Growth", "source": "World Bank", "series_id": "NY.GDP.MKTP.KD.ZG", "direct_download_url": "https://data.worldbank.org/indicator/NY.GDP.MKTP.KD.ZG", "frequency": "Annual", "units": "%", "y2019": "2.8", "y2020": "-2.7", "y2021": "6.6", "y2022": "3.1", "y2023": "2.7", "notes": "World aggregate (constant prices)"}, {"indicator": "Brent Crude Oil Price", "source": "EIA", "series_id": "Brent spot", "direct_download_url": "https://www.eia.gov/dnav/pet/hist/RBRTEd.htm", "frequency": "Daily", "units": "$/bbl (year-avg)", "y2019": "64", "y2020": "42", "y2021": "71", "y2022": "101", "y2023": "82", "notes": "Annual average (rounded)"}, {"indicator": "Gold Price", "source": "LBMA", "series_id": "XAU", "direct_download_url": "https://www.lbma.org.uk/prices-and-data/precious-metal-prices", "frequency": "Daily", "units": "$/oz (year-avg)", "y2019": "1,393", "y2020": "1,770", "y2021": "1,800", "y2022": "1,801", "y2023": "1,941", "notes": "Annual average (rounded)"}, {"indicator": "US Dollar Index (DXY)", "source": "ICE", "series_id": "DXY", "direct_download_url": "https://www.marketwatch.com/investing/index/dxy", "frequency": "Daily", "units": "Index (year-avg)", "y2019": "96.4", "y2020": "94.8", "y2021": "91.4", "y2022": "104.0", "y2023": "103.3", "notes": "Annual average (rounded, indicative)"}, {"indicator": "IMF WEO Global Growth Outlook", "source": "IMF", "series_id": "WEO database", "direct_download_url": "https://www.imf.org/en/Publications/WEO", "frequency": "Biannual", "units": "% projection", "y2019": "—", "y2020": "—", "y2021": "—", "y2022": "—", "y2023": "—", "notes": "Rolling projections; fetch current WEO edition"}, {"indicator": "VIX Volatility Index", "source": "CBOE", "series_id": "VIX", "direct_download_url": "https://www.cboe.com/tradable_products/vix/", "frequency": "Daily", "units": "Index (year-avg)", "y2019": "15.4", "y2020": "29.5", "y2021": "19.7", "y2022": "25.5", "y2023": "17.2", "notes": "Annual average (rounded)"}, {"indicator": "US Consumer Confidence (Conference Board)", "source": "Conference Board", "series_id": "CCI", "direct_download_url": "https://www.conference-board.org/topics/consumer-confidence", "frequency": "Monthly", "units": "Index (year-avg)", "y2019": "128", "y2020": "101", "y2021": "117", "y2022": "104", "y2023": "104", "notes": "Annual average (rounded, indicative)"}, {"indicator": "US Debt-to-GDP", "source": "CBO", "series_id": "Debt held by public", "direct_download_url": "https://www.cbo.gov/data/budget-economic-data", "frequency": "Annual", "units": "% of GDP (year-end)", "y2019": "79", "y2020": "98", "y2021": "96", "y2022": "96", "y2023": "97", "notes": "Gross federal debt vs public ~97% (indicative)"}, {"indicator": "US Core CPI (ex food/energy)", "source": "BLS via FRED", "series_id": "CPILFESL", "direct_download_url": "https://fred.stlouisfed.org/graph/fredgraph.csv?id=CPILFESL", "frequency": "Monthly", "units": "% YoY (year-avg)", "y2019": "2.2", "y2020": "1.7", "y2021": "3.6", "y2022": "6.3", "y2023": "4.8", "notes": "Annual average of monthly YoY"}];
const COLS = ["indicator", "source", "series_id", "direct_download_url", "frequency", "units", "y2019", "y2020", "y2021", "y2022", "y2023", "notes"];
const tbody = document.querySelector('#t tbody'), thead = document.querySelector('#t thead');
thead.innerHTML = '<tr>' + COLS.map(c=>'<th>'+c+'</th>').join('') + '</tr>';
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function link(v){const s=String(v??'');return /^https?:\/\//.test(s)?'<a href="'+s+'" target="_blank" rel="noopener">'+(s.length>46?s.slice(0,46)+'…':s)+'</a>':esc(v);}
function draw(f=''){
  const q=f.toLowerCase(); const rs=DATA.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q)));
  tbody.innerHTML = rs.map(r=>'<tr>'+COLS.map(c=>{const v=r[c];const isUrl=(c==='official_url'||c==='official_fees_url'||c==='direct_download_url');return '<td>'+(isUrl?link(v):esc(v))+'</td>';}).join('')+'</tr>').join('')
    || '<tr><td colspan="'+COLS.length+'">No matches.</td></tr>';
}
document.getElementById('q').addEventListener('input', e=>draw(e.target.value));
draw();
</script></body></html>
